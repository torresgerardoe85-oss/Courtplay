<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#123f73"/>
    <stop offset=".55" stop-color="#082a52"/>
    <stop offset="1" stop-color="#031a36"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9b2f"/>
    <stop offset="1" stop-color="#f26a00"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
  </filter>
</defs>

<rect x="12" y="12" width="488" height="488" rx="92" fill="url(#bg)"/>
<rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="#2e6aa2" stroke-width="4" opacity=".6"/>

<!-- half court -->
<g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".96">
  <path d="M50 129 Q256 38 462 129"/>
  <path d="M88 118v128"/>
  <path d="M424 118v128"/>
  <path d="M167 83v150"/>
  <path d="M345 83v150"/>
  <path d="M167 233h178"/>
  <path d="M207 233v-91h98v91"/>
  <path d="M231 202 Q256 169 281 202" stroke-dasharray="10 13"/>
  <path d="M226 113h60"/>
</g>
<circle cx="256" cy="136" r="16" fill="none" stroke="#ff7a00" stroke-width="8"/>

<!-- X and O -->
<g stroke="#fff" stroke-width="8" stroke-linecap="round">
  <path d="M124 161l24 24M148 161l-24 24"/>
  <path d="M366 170l24 24M390 170l-24 24"/>
</g>
<g fill="none" stroke="#fff" stroke-width="8">
  <circle cx="158" cy="226" r="17"/>
  <circle cx="354" cy="238" r="17"/>
</g>

<!-- play arrow -->
<path d="M178 229 C248 260 340 225 395 155" fill="none" stroke="url(#orange)" stroke-width="13" stroke-linecap="round"/>
<path d="M393 142l14 38-38-8z" fill="#ff7a00"/>

<!-- CP monogram -->
<g filter="url(#shadow)">
  <text x="146" y="374" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="150" font-weight="900">C</text>
  <text x="264" y="374" fill="url(#orange)" font-family="Arial Black,Arial,sans-serif" font-size="150" font-weight="900">P</text>

  <!-- basketball -->
  <circle cx="259" cy="333" r="35" fill="url(#orange)" stroke="#10243c" stroke-width="4"/>
  <path d="M227 329c22-4 45-14 63-30M229 348c21-2 43 4 61 17M260 298c-3 23-1 47 7 69M235 309c12 13 27 26 48 39"
        fill="none" stroke="#10243c" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- name -->
<text x="256" y="444" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="41" font-weight="900" letter-spacing="2">
  <tspan fill="#fff">COURT</tspan><tspan fill="#ff7a00">PLAY</tspan>
</text>
</svg>